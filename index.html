    <meta charset="UTF-8" />

    <meta property="og:title" content="Sai Krishna — Creative & Technical Lead" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // If GitHub Pages is serving this unbuilt root index.html, redirect immediately to /docs/
      if (window.location.hostname.includes('github.io')) {
        var p = window.location.pathname;
        if (!p.includes('/docs')) {
          var target = p.replace(/\/+$/, '') + '/docs/' + window.location.search + window.location.hash;
          window.location.replace(target);
        }
      }
      // Auto-recover ONLY if browser serves cached index.html that tries to load an outdated production chunk
      window.addEventListener('error', function (e) {
        var url = e.target && (e.target.src || e.target.href);
        if (url && url.includes('/assets/index-') && e.target.tagName === 'SCRIPT') {
          var key = 'chunk_reload_' + url;
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body style="background-color: #050507; color: #f4f1ec; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <noscript>Sai Krishna Bethamcharla — Creative & Technical Lead. Please enable JavaScript to watch the series.</noscript>

  </body>
