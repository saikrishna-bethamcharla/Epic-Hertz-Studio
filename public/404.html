<!doctype html>
<html lang="en" style="background-color: #0e0e0d; color: #f4f1ec;">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>Redirecting — Epic Hertz Studio</title>
    <script>
      // Single Page App redirect for GitHub Pages & custom domains
      var path = window.location.pathname;
      var repo = '/Epic-Hertz-Studio/';
      if (path.indexOf(repo) === 0) {
        window.location.replace(repo + (window.location.search || '') + (window.location.hash || ''));
      } else {
        window.location.replace('/' + (window.location.search || '') + (window.location.hash || ''));
      }
    </script>
  </head>
  <body style="background-color: #0e0e0d; color: #f4f1ec; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif;">
    <p style="color: #f59e0b; letter-spacing: 0.1em; font-weight: bold;">Loading Epic Hertz Studio…</p>
  </body>
</html>
