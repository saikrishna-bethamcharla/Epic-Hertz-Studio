    <script>
      // After a new deploy, a tab that still holds the old index.html can ask for chunk files that
      // no longer exist. Reload once so it picks up the current build instead of showing a blank page.
      (function () {
        function reloadOnce(key) {
          try {
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, '1');
          } catch (e) { /* storage blocked: reloading could loop, so don't */ return; }
          window.location.reload();
        }
        // Lazy-loaded chunks (Studio / Portfolio) — Vite fires this when a dynamic import 404s.
        window.addEventListener('vite:preloadError', function (e) {
          e.preventDefault();
          reloadOnce('chunk_reload_preload');
        });
        // Entry bundle itself.
        window.addEventListener('error', function (e) {
          var url = e.target && (e.target.src || e.target.href);
          if (url && url.indexOf('/assets/index-') !== -1 && e.target.tagName === 'SCRIPT') {
            reloadOnce('chunk_reload_' + url);
          }
        }, true);
      })();
    </script>
