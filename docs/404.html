<!DOCTYPE html>
<html lang="en" style="background-color: #050507; color: #f4f1ec;">
  <head>
    <meta charset="utf-8">
    <title>Sai Krishna — Redirecting</title>
    <script>
      var path = window.location.pathname;
      if (!path.includes('/docs')) {
        window.location.replace('/Portfolio/docs/' + window.location.search + window.location.hash);
      } else {
        window.location.replace('/Portfolio/docs/');
      }
    </script>
  </head>
  <body style="background-color: #050507; color: #f4f1ec; margin: 0;"></body>
</html>
